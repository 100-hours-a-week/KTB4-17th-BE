name: Release

on:
    push:
        branches:
            - main

permissions:
    contents: write

jobs:
    release:
        name: Semantic Release
        runs-on: ubuntu-latest

        steps:
            - name: Checkout source
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: "22"
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Semantic Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: npx semantic-release
