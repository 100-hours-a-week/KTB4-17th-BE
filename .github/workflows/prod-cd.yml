name: BE Production CD
permissions:
    contents: read
    id-token: write
env:
    AWS_REGION: ap-northeast-2
    ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
    RELEASE_TAG: ${{ inputs.release_tag }}
    ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com
jobs:
    promote_image:
        name: Promote BE DEV Image
        runs-on: ubuntu-latest
        outputs:
            dev_sha: ${{ steps.dev_sha.outputs.dev_sha }}
            image_digest: ${{ steps.promote.outputs.digest }}
        steps:
            - name: Checkout release source
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  ref: ${{ inputs.release_tag }}
            - uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: ${{ env.AWS_REGION }}
            - name: Resolve DEV SHA
              id: dev_sha
              shell: bash
              run: |
                  set -euo pipefail
                  RELEASE_SHA=$(git rev-parse "${RELEASE_TAG}^{commit}")
                  read -ra COMMITS <<< "$(git rev-list --parents -n 1 "$RELEASE_SHA")"
                  test "${#COMMITS[@]}" -eq 3
                  DEV_SHA="${COMMITS[2]}"
                  test "$(git rev-parse "$RELEASE_SHA^{tree}")" = \
                       "$(git rev-parse "$DEV_SHA^{tree}")"
                  echo "dev_sha=$DEV_SHA" >> "$GITHUB_OUTPUT"
            - name: Resolve the existing image
              id: image
              env:
                  SOURCE_SHA: ${{ steps.dev_sha.outputs.dev_sha }}
              run: |
                  set -euo pipefail
                  DIGEST=$(aws ecr describe-images \
                    --repository-name "$ECR_REPOSITORY" \
                    --image-ids "imageTag=$SOURCE_SHA" \
                    --query 'imageDetails[0].imageDigest' --output text)
                  [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
                  echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
            - name: Promote the image without rebuilding
              id: promote
              env:
                  DIGEST: ${{ steps.image.outputs.digest }}
              run: |
                  set -euo pipefail
                  aws ecr batch-get-image --repository-name "$ECR_REPOSITORY" \
                    --image-ids "imageDigest=$DIGEST" > image.json
                  jq -e '.images | length == 1' image.json
                  jq -er '.images[0].imageManifest' image.json > manifest.json
                  # ECS task digest 검증을 위해 현재 single-platform 빌드만 허용한다.
                  jq -e 'has("manifests") | not' manifest.json
                  aws ecr describe-images --repository-name "$ECR_REPOSITORY" > tags.json
                  EXISTING=$(jq -r --arg tag "$RELEASE_TAG" \
                    '[.imageDetails[] | select((.imageTags // []) | index($tag))
                      | .imageDigest][0] // empty' tags.json)
                  if [ -n "$EXISTING" ]; then
                    test "$EXISTING" = "$DIGEST"
                  else
                    aws ecr put-image --repository-name "$ECR_REPOSITORY" \
                      --image-tag "$RELEASE_TAG" \
                      --image-manifest file://manifest.json > /dev/null
                  fi
                  ACTUAL=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
                    --image-ids "imageTag=$RELEASE_TAG" \
                    --query 'imageDetails[0].imageDigest' --output text)
                  test "$ACTUAL" = "$DIGEST"
                  echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
    deploy:
        name: Deploy BE to ECS
        needs: promote_image
        runs-on: ubuntu-latest
        timeout-minutes: 50
        environment: production
        env:
            ECS_CLUSTER: star23-ecs-cluster
            ECS_SERVICE: star23-be-service
            CONTAINER_NAME: be
        steps:
            - uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: ${{ env.AWS_REGION }}
            - name: Read current ECS task definition
              id: current
              run: |
                  set -euo pipefail
                  aws ecs describe-services --cluster "$ECS_CLUSTER" \
                    --services "$ECS_SERVICE" > service.json
                  jq -e '(.failures | length) == 0 and (.services | length) == 1
                    and .services[0].desiredCount > 0' service.json
                  ARN=$(jq -er '.services[0].taskDefinition' service.json)
                  echo "arn=$ARN" >> "$GITHUB_OUTPUT"
            - name: Render BE image
              id: render
              uses: aws-actions/amazon-ecs-render-task-definition@v1
              with:
                  task-definition-arn: ${{ steps.current.outputs.arn }}
                  container-name: be
                  image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}@${{ needs.promote_image.outputs.image_digest }}
            - name: Deploy BE
              uses: aws-actions/amazon-ecs-deploy-task-definition@v2
              with:
                  task-definition: ${{ steps.render.outputs.task-definition }}
                  cluster: ${{ env.ECS_CLUSTER }}
                  service: ${{ env.ECS_SERVICE }}
                  wait-for-service-stability: true
                  wait-for-minutes: 20
                  wait-max-delay-seconds: 15
concurrency:
    group: be-ecs-production
    cancel-in-progress: false
on:
    workflow_call:
        inputs:
            release_tag:
                description: Semantic-release version tag
                required: true
                type: string
