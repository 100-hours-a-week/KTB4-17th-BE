name: Backend CD

on:
    workflow_call:
        inputs:
            release_tag:
                description: Semantic-release version tag
                required: true
                type: string

permissions:
    contents: read
    id-token: write
# 이미지 입력방식 변경
env:
    AWS_REGION: ap-northeast-2
    ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
    ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com
    RELEASE_TAG: ${{ inputs.release_tag }}

jobs:
    promote_image:
        name: Promote DEV Image
        runs-on: ubuntu-latest

        outputs:
            image_url: ${{ steps.promote.outputs.image_url }}
            dev_sha: ${{ steps.dev_sha.outputs.dev_sha }}

        steps:
            - name: Checkout source
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: ${{ env.AWS_REGION }}

            # Release Tag가 붙은 main Merge Commit의
            # 두 번째 parent = merge 당시 dev HEAD
            - name: Resolve DEV SHA
              id: dev_sha
              run: |
                  set -euo pipefail

                  DEV_SHA=$(git rev-parse "${RELEASE_TAG}^2")

                  echo "DEV SHA: $DEV_SHA"
                  echo "dev_sha=$DEV_SHA" >> "$GITHUB_OUTPUT"

            # 해당 SHA 이미지가 실제 ECR에 존재하는지 확인
            - name: Verify DEV image
              env:
                  DEV_SHA: ${{ steps.dev_sha.outputs.dev_sha }}
              run: |
                  set -euo pipefail

                  aws ecr describe-images \
                    --repository-name "$ECR_REPOSITORY" \
                    --image-ids imageTag="$DEV_SHA" \
                    --region "$AWS_REGION"

            # DEV에서 검증한 SHA 이미지의 Manifest를 가져와
            # Release Version Tag를 추가
            - name: Promote image
              id: promote
              env:
                  DEV_SHA: ${{ steps.dev_sha.outputs.dev_sha }}
              run: |
                  set -euo pipefail

                  MANIFEST=$(aws ecr batch-get-image \
                    --repository-name "$ECR_REPOSITORY" \
                    --image-ids imageTag="$DEV_SHA" \
                    --query 'images[0].imageManifest' \
                    --output text \
                    --region "$AWS_REGION")

                  if [ -z "$MANIFEST" ] || [ "$MANIFEST" = "None" ]; then
                    echo "ECR image manifest not found: $DEV_SHA"
                    exit 1
                  fi

                  aws ecr put-image \
                    --repository-name "$ECR_REPOSITORY" \
                    --image-tag "$RELEASE_TAG" \
                    --image-manifest "$MANIFEST" \
                    --region "$AWS_REGION"

                  IMAGE_URL="$ECR_REGISTRY/$ECR_REPOSITORY:$RELEASE_TAG"

                  echo "Promoted:"
                  echo "$DEV_SHA -> $RELEASE_TAG"
                  echo "IMAGE: $IMAGE_URL"
    deploy:
        name: Backend Blue-Green Deploy
        needs: promote_image
        runs-on: ubuntu-latest
        environment: production

        steps:
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Deploy to PROD EC2 via SSM
              env:
                  PROD_EC2_INSTANCE_ID: ${{ secrets.PROD_EC2_INSTANCE_ID }}
              run: |
                  set -euo pipefail

                  IMAGE_URL="$ECR_REGISTRY/$ECR_REPOSITORY:$RELEASE_TAG"

                  PARAMETERS=$(jq -n \
                    --arg image "$IMAGE_URL" \
                    '{commands: [
                      "set -eu",
                      (
                        "sudo -iu ubuntu bash -lc " +
                        (("cd /home/ubuntu/app && ./deploy-be.sh " + ($image | @sh)) | @sh)
                      )
                    ]}')

                  COMMAND_ID=$(aws ssm send-command \
                    --instance-ids "$PROD_EC2_INSTANCE_ID" \
                    --document-name "AWS-RunShellScript" \
                    --comment "Deploy backend image $RELEASE_TAG to PROD" \
                    --timeout-seconds 600 \
                    --parameters "$PARAMETERS" \
                    --region "$AWS_REGION" \
                    --query 'Command.CommandId' \
                    --output text)

                  echo "SSM command ID: $COMMAND_ID"

                  for attempt in $(seq 1 120); do
                    STATUS=$(aws ssm get-command-invocation \
                      --command-id "$COMMAND_ID" \
                      --instance-id "$PROD_EC2_INSTANCE_ID" \
                      --region "$AWS_REGION" \
                      --query 'Status' \
                      --output text 2>/dev/null || true)

                    case "$STATUS" in
                      Success)
                        break
                        ;;
                      Failed|Cancelled|TimedOut|Cancelling)
                        aws ssm get-command-invocation \
                          --command-id "$COMMAND_ID" \
                          --instance-id "$PROD_EC2_INSTANCE_ID" \
                          --region "$AWS_REGION"
                        exit 1
                        ;;
                      Pending|InProgress|Delayed|"")
                        sleep 5
                        ;;
                      *)
                        echo "Unexpected SSM command status: $STATUS"
                        exit 1
                        ;;
                    esac
                  done

                  if [ "${STATUS:-}" != "Success" ]; then
                    echo "SSM command did not complete within 10 minutes. Last status: ${STATUS:-unknown}"
                    aws ssm get-command-invocation \
                      --command-id "$COMMAND_ID" \
                      --instance-id "$PROD_EC2_INSTANCE_ID" \
                      --region "$AWS_REGION" || true
                    exit 1
                  fi

                  aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$PROD_EC2_INSTANCE_ID" \
                    --region "$AWS_REGION"

