name: CI backend

on:
  push:
    branches:
      - chore/backend-CD
  pull_request:
    branches:
      - dev

permissions:
  contents: write
  pull-requests: write

jobs:
  backend_ci:
    runs-on: ubuntu-latest

    steps:
      - name: Check PR source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 커밋 기록 전체를 볼 수 있도록 전부 받옴 =0 (시크릿 스캔에서 사용)

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Formatter Check
        run: ./gradlew spotlessCheck


        # 의존성 검사 대신 Gitleaks으로 변경
      - name: Secret Scan
        env:
          # PR이면 PR 브랜치의 최신 커밋이나 push면 방금 올라온 커밋만 검사
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --log-opts="-1 $COMMIT" --redact --no-banner --verbose


        #단위 테스트
      - name: Unit Test
        run: ./gradlew unitTest


        #Api테스트
      - name: API Test
        run: ./gradlew apiTest

        #테스트 레포트 작성
      - name: Upload Test Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests
          retention-days: 7

      - name: Build
        run: ./gradlew clean bootJar -x test
