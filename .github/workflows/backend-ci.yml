name: CI backend

on:
  push:
    branches:
      - chore/backend-CD
  pull_request:
    branches:
      - dev

permissions:
  contents: write
  pull-requests: write

jobs:
  backend_ci:
    runs-on: ubuntu-latest

    steps:
      - name: Check PR source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Formatter Check
        run: ./gradlew spotlessCheck

      - name: Set Dependency-Check cache date #캐시 추가
        id: dependency-check-cache-date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache Dependency-Check database
        uses: actions/cache@v4
        with:
          path: ~/.gradle/dependency-check-data
          key: ${{ runner.os }}-dependency-check-${{ hashFiles('**/build.gradle*', 'gradle/libs.versions.toml') }}-${{ steps.dependency-check-cache-date.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-${{ hashFiles('**/build.gradle*', 'gradle/libs.versions.toml') }}-

      - name: Dependency Vulnerability Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./gradlew dependencyCheckAnalyze --info

      - name: Build
        run: ./gradlew clean bootJar -x test

      - name: Auto-merge
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
