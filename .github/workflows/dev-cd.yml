name: dev-cd.yml
on:
    push:
        branches:
            - dev

concurrency:
    group: backend-dev-deploy
    cancel-in-progress: true

permissions:
    contents: read
    id-token: write

env:
    AWS_REGION: ap-northeast-2
    ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
    ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com
    IMAGE_TAG: ${{ github.sha }}

jobs:

    build_image:
        name: Build and Push DEV Image
        runs-on: ubuntu-latest
        steps:
            - name: Checkout source
              uses: actions/checkout@v7

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Login to ECR
              run: |
                  aws ecr get-login-password --region "$AWS_REGION" |
                    docker login \
                      --username AWS \
                      --password-stdin "$ECR_REGISTRY"

            - name: Build Docker image
              run: |
                  docker build \
                    -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
                    .

            - name: Push image to ECR

              run: |
                  docker push \
                    "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

    deploy:

        name: Deploy Backend to DEV
        needs: build_image
        runs-on: ubuntu-latest
        environment: development

        steps:
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Deploy to DEV EC2 via SSM
              env:
                  DEV_EC2_INSTANCE_ID: ${{ secrets.DEV_EC2_INSTANCE_ID }}

              run: |
                  set -euo pipefail
                  IMAGE_URL="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

                  PARAMETERS=$(jq -n \
                    --arg region "$AWS_REGION" \
                    --arg registry "$ECR_REGISTRY" \
                    --arg image "$IMAGE_URL" \
                    '{commands: [
                      "set -eu",
                      (
                        "sudo -iu ubuntu bash -lc " +
                        ((
                          "cd /home/ubuntu/app && " +
                          "aws ecr get-login-password --region " + ($region | @sh) +
                          " | docker login --username AWS --password-stdin " + ($registry | @sh) +
                          " && sed -i " + (("s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=" + $image + "|") | @sh) + " .env" +
                          " && docker compose pull backend" +
                          " && docker compose up -d --no-deps backend"
                        ) | @sh)
                      )
                    ]}')

                  COMMAND_ID=$(aws ssm send-command \
                    --instance-ids "$DEV_EC2_INSTANCE_ID" \
                    --document-name "AWS-RunShellScript" \
                    --comment "Deploy backend image $IMAGE_TAG to DEV" \
                    --timeout-seconds 600 \
                    --parameters "$PARAMETERS" \
                    --region "$AWS_REGION" \
                    --query 'Command.CommandId' \
                    --output text)

                  echo "SSM command ID: $COMMAND_ID"

                  for attempt in $(seq 1 120); do
                    STATUS=$(aws ssm get-command-invocation \
                      --command-id "$COMMAND_ID" \
                      --instance-id "$DEV_EC2_INSTANCE_ID" \
                      --region "$AWS_REGION" \
                      --query 'Status' \
                      --output text 2>/dev/null || true)

                    case "$STATUS" in
                      Success)
                        break
                        ;;
                      Failed|Cancelled|TimedOut|Cancelling)
                        aws ssm get-command-invocation \
                          --command-id "$COMMAND_ID" \
                          --instance-id "$DEV_EC2_INSTANCE_ID" \
                          --region "$AWS_REGION"
                        exit 1
                        ;;
                      Pending|InProgress|Delayed|"")
                        sleep 5
                        ;;
                      *)
                        echo "Unexpected SSM command status: $STATUS"
                        exit 1
                        ;;
                    esac
                  done

                  if [ "${STATUS:-}" != "Success" ]; then
                    echo "SSM command did not complete within 10 minutes. Last status: ${STATUS:-unknown}"
                    aws ssm get-command-invocation \
                      --command-id "$COMMAND_ID" \
                      --instance-id "$DEV_EC2_INSTANCE_ID" \
                      --region "$AWS_REGION" || true
                    exit 1
                  fi

                  aws ssm get-command-invocation \
                    --command-id "$COMMAND_ID" \
                    --instance-id "$DEV_EC2_INSTANCE_ID" \
                    --region "$AWS_REGION"

