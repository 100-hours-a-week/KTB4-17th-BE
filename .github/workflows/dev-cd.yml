            #       mkdir -p "$RUNNER_TEMP/ssh"
            #       printf '%s\n' "$EC2_SSH_PRIVATE_KEY" \
            #         > "$RUNNER_TEMP/ssh/ec2_key"
            #       printf '%s\n' "$EC2_KNOWN_HOSTS" \
            #         > "$RUNNER_TEMP/ssh/known_hosts"
            #       chmod 600 "$RUNNER_TEMP/ssh/ec2_key"
            #       chmod 600 "$RUNNER_TEMP/ssh/known_hosts"

