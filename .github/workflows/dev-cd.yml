name: dev-cd.yml
on:
    push:
        branches:
            - dev

concurrency:
    group: backend-dev-deploy
    cancel-in-progress: true

permissions:
    contents: read
    id-token: write

env:
    AWS_REGION: ap-northeast-2
    ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
    ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-northeast-2.amazonaws.com
    IMAGE_TAG: ${{ github.sha }}

jobs:

    build_image:
        name: Build and Push DEV Image
        runs-on: ubuntu-latest
        steps:
            - name: Checkout source
              uses: actions/checkout@v7

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Login to ECR
              run: |
                  aws ecr get-login-password --region "$AWS_REGION" |
                    docker login \
                      --username AWS \
                      --password-stdin "$ECR_REGISTRY"

            - name: Build Docker image
              run: |
                  docker build \
                    -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" \
                    .

            - name: Push image to ECR

              run: |
                  docker push \
                    "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

    deploy:

        name: Deploy Backend to DEV
        needs: build_image
        runs-on: ubuntu-latest
        environment: development

        steps:
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
                  aws-region: ${{ env.AWS_REGION }}

            - name: Deploy to DEV EC2 via SSM
              run: |
                  set -euo pipefail
                  IMAGE_URL="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

                  PARAMETERS=$(jq -n \
                    --arg region "$AWS_REGION" \
                    --arg registry "$ECR_REGISTRY" \
                    --arg image "$IMAGE_URL" \
                    '{commands: [
                      "set -eu",
                      (
                        "sudo -iu ubuntu bash -lc " +
                        ((
                          "cd /home/ubuntu/app && " +
                          "aws ecr get-login-password --region " + ($region | @sh) +
                          " | docker login --username AWS --password-stdin " + ($registry | @sh) +
                          " && sed -i " + (("s|^BACKEND_IMAGE=.*|BACKEND_IMAGE=" + $image + "|") | @sh) + " .env" +
                          " && docker compose pull backend" +
                          " && docker compose up -d --no-deps backend" +
                          # 새 컨테이너가 healthy가 될 때까지 기다린 뒤에만 이 EC2를 성공으로 보고한다.
                          # be-1은 8080을 호스트에 publish하지 않으므로 컨테이너 IP로 확인한다.
                          " && { CID=$(docker compose ps -q backend);" +
                          " for i in $(seq 1 60); do" +
                          " IP=$(docker inspect -f \"{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}\" \"$CID\");" +
                          " if curl -fsS -m 3 \"http://$IP:8080/actuator/health\" >/dev/null 2>&1; then echo backend healthy; exit 0; fi;" +
                          " sleep 3; done;" +
                          " echo backend health check failed; docker compose logs --tail 50 backend; exit 1; }"
                        ) | @sh)
                      )
                    ]}')

                  # Environment=dev 태그가 붙은 SSM 관리 EC2에 한 대씩 순서대로 실행한다.
                  # 앞 서버가 healthy가 된 뒤에 다음 서버를 재시작하므로 배포 중에도 한 대는 요청을 받는다.
                  # 한 대라도 실패하면 남은 서버에는 배포하지 않고 전체 명령을 실패 처리한다.
                  COMMAND_ID=$(aws ssm send-command \
                    --targets "Key=tag:Environment,Values=dev" \
                    --document-name "AWS-RunShellScript" \
                    --comment "Deploy backend image $IMAGE_TAG to DEV" \
                    --timeout-seconds 600 \
                    --max-concurrency "1" \
                    --max-errors "0" \
                    --parameters "$PARAMETERS" \
                    --region "$AWS_REGION" \
                    --query 'Command.CommandId' \
                    --output text)

                  echo "SSM command ID: $COMMAND_ID"

                  # 여러 EC2에 순서대로 실행된 SSM 명령의 전체 상태가 종료될 때까지 기다린다(최대 20분).
                  for attempt in $(seq 1 240); do
                    COMMAND=$(aws ssm list-commands \
                      --command-id "$COMMAND_ID" \
                      --region "$AWS_REGION" \
                      --output json)

                    STATUS=$(jq -r '.Commands[0].Status // empty' <<< "$COMMAND")
                    TARGET_COUNT=$(jq -r '.Commands[0].TargetCount // 0' <<< "$COMMAND")

                    case "$STATUS" in
                      Success)
                        break
                        ;;
                      Failed|Cancelled|TimedOut|Cancelling)
                        aws ssm list-command-invocations \
                          --command-id "$COMMAND_ID" \
                          --details \
                          --region "$AWS_REGION"
                        exit 1
                        ;;
                      Pending|InProgress|Delayed|"")
                        sleep 5
                        ;;
                      *)
                        echo "Unexpected SSM command status: $STATUS"
                        exit 1
                        ;;
                    esac
                  done

                  if [ "${STATUS:-}" != "Success" ]; then
                    echo "SSM command did not complete within 20 minutes. Last status: ${STATUS:-unknown}"
                    aws ssm list-command-invocations \
                      --command-id "$COMMAND_ID" \
                      --details \
                      --region "$AWS_REGION" || true
                    exit 1
                  fi

                  # 태그 오타 등으로 배포 대상이 0대인 경우 성공으로 오인하지 않도록 실패시킨다.
                  if [ "${TARGET_COUNT:-0}" -eq 0 ]; then
                    echo "No SSM managed instances matched Environment=dev"
                    exit 1
                  fi

                  INVOCATIONS=$(aws ssm list-command-invocations \
                    --command-id "$COMMAND_ID" \
                    --details \
                    --region "$AWS_REGION" \
                    --output json)

                  jq . <<< "$INVOCATIONS"

                  # 대상 EC2의 개별 실행 결과가 모두 성공했는지 확인한다.
                  if ! jq -e \
                    '(.CommandInvocations | length) > 0 and
                     all(.CommandInvocations[]; .Status == "Success")' \
                    <<< "$INVOCATIONS" > /dev/null; then
                    echo "One or more DEV EC2 deployments failed"
                    exit 1
                  fi

                  SUCCESS_COUNT=$(jq '.CommandInvocations | length' <<< "$INVOCATIONS")
                  echo "Successfully deployed to $SUCCESS_COUNT DEV EC2 instance(s)"

