spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

app:
  ai-practice:
    base-url: ${AI_PRACTICE_BASE_URL:http://localhost:8000}

logging:
  level:
    org.hibernate.SQL: debug              # 실행되는 SQL 출력
    org.hibernate.orm.jdbc.bind: trace    # 바인딩되는 파라미터 값까지 출력
