spring:
  config:
    import: optional:file:.env[.properties] # .env 파일 읽을 수 있도록 해주는 설정

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create   # 개발 중에는 create / create-drop / update 중 선택
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  pending-expiration-minutes: 10
  service-expiration-minutes: 60

kakao:
  oauth:
    client-id: ${CLIENT_ID}
    client-secret: ${CLIENT_SECRET}
    redirect-uri: ${REDIRECT_URI}
    authorization-uri: ${AUTHORIZATION_URI}
    token-uri: ${TOKEN_URI}
    user-info-uri: ${USER_INFO_URI}

logging:
  level:
    org.hibernate.SQL: debug

app:
  auth:
    service-redirect-uri: ${AUTH_SERVICE_REDIRECT_URI}
    registration-redirect-uri: ${AUTH_REGISTRATION_REDIRECT_URI}
    onboarding-redirect-uri: ${AUTH_ONBOARDING_REDIRECT_URI}
    secure-cookie: ${AUTH_COOKIE_SECURE}
    same-site: ${AUTH_COOKIE_SAME_SITE}

  security:
    allowed-origins: ${AUTH_ALLOWED_ORIGINS}
