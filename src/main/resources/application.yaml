spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/dating_app?serverTimezone=UTC&useSSL=false}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create   # 개발 중에는 create / create-drop / update 중 선택
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug

app:
  auth:
    service-redirect-uri: ${AUTH_SERVICE_REDIRECT_URI:}
    registration-redirect-uri: ${AUTH_REGISTRATION_REDIRECT_URI:}
    onboarding-redirect-uri: ${AUTH_ONBOARDING_REDIRECT_URI:}
    secure-cookie: ${AUTH_COOKIE_SECURE:false}
    same-site: ${AUTH_COOKIE_SAME_SITE:Lax}

  security:
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:}
