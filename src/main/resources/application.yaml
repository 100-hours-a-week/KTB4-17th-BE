spring:
  # 활성 프로파일: 환경변수 SPRING_PROFILES_ACTIVE 로 지정, 없으면 local
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  config:
    import: optional:file:.env[.properties] # .env 파일 읽을 수 있도록 해주는 설정

  servlet:
    multipart:
      # 임계값을 전체 요청 제한보다 크게 설정해 허용된 업로드를 메모리에 유지한다.
      max-file-size: 5MB
      max-request-size: 6MB
      file-size-threshold: 6MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:migration}
    password: ${RABBITMQ_PASSWORD:migration-local}
    virtual-host: ${RABBITMQ_VHOST:/}
    # 발행별 브로커 수신 확인을 받아 실패한 발행을 재시도할 수 있게 한다.
    publisher-confirm-type: correlated
    # 오프라인 사용자는 임시 WS 큐가 없어 REST로 이력을 조회한다.
    template:
      mandatory: false
    connection-timeout: 5s

  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:60s}

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL}

  flyway:
    # 기존 DB는 최초 배포 전에 전체 스키마 대조와 명시적 baseline을 완료해야 한다.
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: false
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false

  sql:
    init:
      mode: never

jwt:
  secret: ${JWT_SECRET}
  pending-expiration-minutes: ${JWT_PENDING_EXPIRATION_MINUTES}
  service-expiration-minutes: ${JWT_SERVICE_EXPIRATION_MINUTES}
  refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}

kakao:
  oauth:
    client-id: ${CLIENT_ID}
    client-secret: ${CLIENT_SECRET}
    redirect-uri: ${REDIRECT_URI}
    authorization-uri: ${AUTHORIZATION_URI}
    token-uri: ${TOKEN_URI}
    user-info-uri: ${USER_INFO_URI}
    talk-profile-uri: ${KAKAO_TALK_PROFILE_URI}

app:
  auth:
    login-redirect-uri: ${AUTH_LOGIN_REDIRECT_URI:${AUTH_SERVICE_REDIRECT_URI}}
    service-redirect-uri: ${AUTH_SERVICE_REDIRECT_URI}
    registration-redirect-uri: ${AUTH_REGISTRATION_REDIRECT_URI}
    onboarding-redirect-uri: ${AUTH_ONBOARDING_REDIRECT_URI}
    secure-cookie: ${AUTH_COOKIE_SECURE}
    same-site: ${AUTH_COOKIE_SAME_SITE}

  security:
    allowed-origins: ${AUTH_ALLOWED_ORIGINS}

  notification:
    sse:
      timeout-ms: ${APP_NOTIFICATION_SSE_TIMEOUT_MS:1800000}
      heartbeat-delay-ms: ${APP_NOTIFICATION_SSE_HEARTBEAT_DELAY_MS:30000}

  chat:
    monitoring:
      broker: rabbit
      outbox-snapshot-enabled: ${CHAT_MONITORING_OUTBOX_SNAPSHOT_ENABLED:true}
      snapshot-delay-ms: ${CHAT_MONITORING_SNAPSHOT_DELAY_MS:10000}
      query-timeout-seconds: ${CHAT_MONITORING_QUERY_TIMEOUT_SECONDS:3}
    # HTTP 발행과 WebSocket 구독이 같은 브로커·교환기를 사용하도록 맞춘다.
    rabbit:
      host: ${spring.rabbitmq.host}
      stomp-port: ${RABBITMQ_STOMP_PORT:61613}
      username: ${spring.rabbitmq.username}
      password: ${spring.rabbitmq.password}
      virtual-host: ${spring.rabbitmq.virtual-host}
      exchange: ${RABBITMQ_CHAT_EXCHANGE:ecs.chat.events}
      confirm-timeout-ms: ${RABBITMQ_CONFIRM_TIMEOUT_MS:5000}
    outbox-publish-delay-ms: ${APP_CHAT_OUTBOX_PUBLISH_DELAY_MS:1000}
    outbox:
      max-failures: ${APP_CHAT_OUTBOX_MAX_FAILURES:10}
      claim-lease-ms: ${APP_CHAT_OUTBOX_CLAIM_LEASE_MS:30000}
      # 전환 전 DB 동기화가 끝난 컨테이너만 발행을 시작하도록 한다.
      start-gate-file: ${APP_CHAT_OUTBOX_START_GATE_FILE:}

  chat-delegation:
    base-url: ${AI_CHAT_DELEGATION_BASE_URL:}
    api-key: ${AI_CHAT_DELEGATION_API_KEY:}

  ai-practice:
    base-url: ${AI_PRACTICE_BASE_URL:}
    initial-session-path: ${AI_PRACTICE_INITIAL_SESSION_PATH:/ai/api/v1/practice/start}
    message-path: ${AI_PRACTICE_MESSAGE_PATH:/ai/api/v1/practice/%s/messages}
    retry-path: ${AI_PRACTICE_RETRY_PATH:/ai/api/v1/practice/%s/retry}
    end-session-path: ${AI_PRACTICE_END_SESSION_PATH:/ai/api/v1/practice/%s/end}
    api-key: ${AI_PRACTICE_API_KEY:}
    callback-secret: ${AI_PRACTICE_CALLBACK_SECRET:}
    connect-timeout-ms: ${AI_PRACTICE_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${AI_PRACTICE_READ_TIMEOUT_MS:120000}
    daily-limit: ${AI_PRACTICE_DAILY_LIMIT:30}
    max-outbox-failures: ${AI_PRACTICE_OUTBOX_MAX_FAILURES:10}
    outbox-publish-delay-ms: ${AI_PRACTICE_OUTBOX_PUBLISH_DELAY_MS:1000}

  persona-ai:
    base-url: ${AI_PERSONA_BASE_URL:}

  persona-kakao:
    base-url: ${AI_KAKAO_BASE_URL:${AI_PERSONA_BASE_URL:}}
    max-size-bytes: ${AI_KAKAO_MAX_SIZE_BYTES:5242880}
    connect-timeout-ms: ${AI_KAKAO_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${AI_KAKAO_READ_TIMEOUT_MS:30000}

  ai-simulation:
    base-url: ${AI_SIMULATION_BASE_URL:}
    simulation-path: ${AI_SIMULATION_PATH:/ai/api/v1/simulation}
    connect-timeout-ms: ${AI_SIMULATION_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${AI_SIMULATION_READ_TIMEOUT_MS:130000}
    async-pool-size: ${AI_SIMULATION_ASYNC_POOL_SIZE:1}
    async-queue-capacity: ${AI_SIMULATION_ASYNC_QUEUE_CAPACITY:4}
    async-shutdown-wait-seconds: ${AI_SIMULATION_ASYNC_SHUTDOWN_WAIT_SECONDS:30}
    max-processing-age-seconds: ${AI_SIMULATION_MAX_PROCESSING_AGE_SECONDS:900}

  file:
    max-size-bytes: ${APP_FILE_MAX_SIZE_BYTES}
    allowed-mime-types: ${APP_FILE_ALLOWED_MIME_TYPES}
    upload-intent-ttl: ${APP_FILE_UPLOAD_INTENT_TTL}
    upload-intent-retention: ${APP_FILE_UPLOAD_INTENT_RETENTION}
    cleanup-delay-ms: ${APP_FILE_CLEANUP_DELAY_MS}
    cleanup-batch-size: ${APP_FILE_CLEANUP_BATCH_SIZE}
    s3:
      bucket: ${AWS_S3_BUCKET}
      region: ${AWS_S3_REGION}
      upload-url-expiration: ${AWS_S3_UPLOAD_URL_EXPIRATION}
      download-url-expiration: ${AWS_S3_DOWNLOAD_URL_EXPIRATION}

management:
  metrics:
    tags:
      deployment: ${MIGRATION_DEPLOYMENT:green}
      broker: ${app.chat.monitoring.broker}
  endpoints:
    web:
      exposure:
        include: health,prometheus

server:
  # 종료 시 처리 중인 HTTP 요청이 마무리될 시간을 준다.
  shutdown: graceful

sentry:
  dsn: https://3a23addb65af845726a75c610836d234@o4512169151496192.ingest.us.sentry.io/4512169955229696
  # 요청 헤더와 사용자 IP 등의 추가 정보 수집
  # 수집 항목: https://docs.sentry.io/platforms/java/guides/spring-boot/data-management/data-collected/
  send-default-pii: true
