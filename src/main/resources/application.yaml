spring:
  # 활성 프로파일: 환경변수 SPRING_PROFILES_ACTIVE 로 지정, 없으면 local
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  config:
    import: optional:file:.env[.properties] # .env 파일 읽을 수 있도록 해주는 설정

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL}

  flyway:
    # 기존 DB는 최초 배포 전에 전체 스키마 대조와 명시적 baseline을 완료해야 한다.
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: false
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false

  sql:
    init:
      mode: never

jwt:
  secret: ${JWT_SECRET}
  pending-expiration-minutes: ${JWT_PENDING_EXPIRATION_MINUTES}
  service-expiration-minutes: ${JWT_SERVICE_EXPIRATION_MINUTES}
  refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}

kakao:
  oauth:
    client-id: ${CLIENT_ID}
    client-secret: ${CLIENT_SECRET}
    redirect-uri: ${REDIRECT_URI}
    authorization-uri: ${AUTHORIZATION_URI}
    token-uri: ${TOKEN_URI}
    user-info-uri: ${USER_INFO_URI}

app:
  auth:
    login-redirect-uri: ${AUTH_LOGIN_REDIRECT_URI:${AUTH_SERVICE_REDIRECT_URI}}
    service-redirect-uri: ${AUTH_SERVICE_REDIRECT_URI}
    registration-redirect-uri: ${AUTH_REGISTRATION_REDIRECT_URI}
    onboarding-redirect-uri: ${AUTH_ONBOARDING_REDIRECT_URI}
    secure-cookie: ${AUTH_COOKIE_SECURE}
    same-site: ${AUTH_COOKIE_SAME_SITE}

  security:
    allowed-origins: ${AUTH_ALLOWED_ORIGINS}

  chat:
    outbox:
      max-failures: ${APP_CHAT_OUTBOX_MAX_FAILURES:10}

  ai-practice:
    base-url: ${AI_PRACTICE_BASE_URL:}
    initial-session-path: ${AI_PRACTICE_INITIAL_SESSION_PATH:/ai/api/v1/practice/start}
    message-path: ${AI_PRACTICE_MESSAGE_PATH:/ai/api/v1/practice/%s/messages}
    retry-path: ${AI_PRACTICE_RETRY_PATH:/ai/api/v1/practice/%s/retry}
    end-session-path: ${AI_PRACTICE_END_SESSION_PATH:/ai/api/v1/practice/%s/end}
    api-key: ${AI_PRACTICE_API_KEY:}
    callback-secret: ${AI_PRACTICE_CALLBACK_SECRET:}
    connect-timeout-ms: ${AI_PRACTICE_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${AI_PRACTICE_READ_TIMEOUT_MS:120000}
    daily-limit: ${AI_PRACTICE_DAILY_LIMIT:30}
    max-outbox-failures: ${AI_PRACTICE_OUTBOX_MAX_FAILURES:10}
    outbox-publish-delay-ms: ${AI_PRACTICE_OUTBOX_PUBLISH_DELAY_MS:1000}

  persona-ai:
    base-url: ${AI_PERSONA_BASE_URL:}

  ai-simulation:
    base-url: ${AI_SIMULATION_BASE_URL:}
    simulation-path: ${AI_SIMULATION_PATH:/ai/api/v1/simulation}
    connect-timeout-ms: ${AI_SIMULATION_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${AI_SIMULATION_READ_TIMEOUT_MS:130000}

  file:
    max-size-bytes: ${APP_FILE_MAX_SIZE_BYTES}
    allowed-mime-types: ${APP_FILE_ALLOWED_MIME_TYPES}
    upload-intent-ttl: ${APP_FILE_UPLOAD_INTENT_TTL}
    upload-intent-retention: ${APP_FILE_UPLOAD_INTENT_RETENTION}
    cleanup-delay-ms: ${APP_FILE_CLEANUP_DELAY_MS}
    cleanup-batch-size: ${APP_FILE_CLEANUP_BATCH_SIZE}
    s3:
      bucket: ${AWS_S3_BUCKET}
      region: ${AWS_S3_REGION}
      upload-url-expiration: ${AWS_S3_UPLOAD_URL_EXPIRATION}
      download-url-expiration: ${AWS_S3_DOWNLOAD_URL_EXPIRATION}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

sentry:
  dsn: https://3a23addb65af845726a75c610836d234@o4512169151496192.ingest.us.sentry.io/4512169955229696
