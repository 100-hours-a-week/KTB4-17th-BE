# Apply independently to both EKS clusters; exact existing BE names only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-be-deployment-observer
  namespace: argocd
rules:
  - apiGroups: [argoproj.io]
    resources: [applications]
    resourceNames:
      - auth-api
      - user-api
      - onboarding-api
      - chat-api
      - chat-socket
      - recommend-api
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-be-deployment-observer
  namespace: argocd
subjects:
  - kind: Group
    name: star23-jenkins-observers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: jenkins-be-deployment-observer
  apiGroup: rbac.authorization.k8s.io
