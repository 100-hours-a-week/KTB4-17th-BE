plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.10.2'
	id 'org.owasp.dependencycheck' version '13.0.0'
	id 'checkstyle'
}

group = 'com.team'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-kafka'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	implementation platform('software.amazon.awssdk:bom:2.55.1')
	implementation 'software.amazon.awssdk:s3'
	implementation 'io.sentry:sentry-spring-boot-4-starter:8.58.0'
	implementation 'io.sentry:sentry-logback:8.58.0'

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	runtimeOnly 'org.flywaydb:flyway-mysql'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-mysql'
	testImplementation 'org.testcontainers:testcontainers-kafka'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

def notificationMultiProcessTag = 'notification-multiprocess'

tasks.named('test') {
	useJUnitPlatform {
		excludeTags notificationMultiProcessTag
		if (!project.hasProperty('runS3IntegrationTest')) {
			excludeTags 's3-integration'
		}
	}
}

// API 테스트: MockMvc로 컨트롤러 계층을 검증하는 테스트
def apiTestPatterns = ['*ControllerTest', '*SecurityConfigTest']
// 통합 테스트: 전체 컨텍스트나 Testcontainers(Docker)가 필요한 테스트 현재 CI에서 동작하지 않음
def integrationTestPatterns = [
	'*IntegrationTest',
	'*ChatWebSocketHandshakeTest',
	'*DatingBackendApplicationTests'
]

tasks.register('apiTest', Test) {
	description = 'MockMvc 기반 API 테스트만 실행.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		excludeTags notificationMultiProcessTag
	}
	filter {
		apiTestPatterns.each { includeTestsMatching it }
	}
}

tasks.register('unitTest', Test) {
	description = ' 단위 테스트만 실행.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		excludeTags notificationMultiProcessTag
	}
	filter {
		(apiTestPatterns + integrationTestPatterns).each { excludeTestsMatching it }
	}
}

def notificationApplicationJar = tasks.named('bootJar').flatMap { it.archiveFile }

tasks.register('notificationMultiProcessTest', Test) {
	description = '독립 JVM과 MySQL·Kafka를 사용하는 알림 통합 테스트 실행.'
	group = 'verification'
	dependsOn tasks.named('bootJar')
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags notificationMultiProcessTag
	}
	filter {
		includeTestsMatching 'com.team.dating_backend.notification.integration.NotificationMultiProcess*IntegrationTest'
		failOnNoMatchingTests = true
	}
	maxParallelForks = 1
	failOnNoDiscoveredTests = true
	inputs.file(notificationApplicationJar).withPropertyName('notificationApplicationJar')
	systemProperty 'notification.test.application-jar', notificationApplicationJar.get().asFile.absolutePath
	systemProperty 'notification.test.output-directory',
		layout.projectDirectory.dir('../reports/notification-multiprocess').asFile.absolutePath
	outputs.upToDateWhen { false }
	outputs.doNotCacheIf('Independent backend processes, MySQL, and Kafka require a fresh run') { true }
}

spotless {
	java {
		eclipse().configFile('config/formatter/java-formatter.xml')

		removeUnusedImports()
		forbidWildcardImports()

		trimTrailingWhitespace()
		endWithNewline()
	}
}

checkstyle {
	toolVersion = '14.1.0'
}

def nvdApiKey = System.getenv('NVD_API_KEY')

dependencyCheck {
	if (nvdApiKey?.trim()) {
		nvd {
			apiKey = nvdApiKey
		}
	}
}
